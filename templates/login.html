<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Skill Swap</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

<div class="login-box">

    <h1>Login</h1>

    <form method="POST">

        <input
        type="email"
        name="email"
        placeholder="Enter Email"
        required>

        <input
         type="password"
         name="password"
         placeholder="Enter Password"
         required>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="/signup">Sign Up</a>
    </p>

</div>

</body>

</html>
